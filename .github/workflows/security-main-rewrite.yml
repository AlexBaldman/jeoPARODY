name: Security Main Rewrite

on:
  push:
    branches: [chore/dependency-security-triage]

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/dependency-security-triage

      - name: Remove browser credential URL injection
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const path = 'src/main.js';
          let source = fs.readFileSync(path, 'utf8');

          source = source.replace(
            '    // Inject API keys via URL params (dev only)\n    injectKeysFromURL();',
            '    // Apply non-secret development preferences from URL params.\n    applyDevPreferencesFromURL();',
          );

          const start = source.indexOf('function injectKeysFromURL() {');
          const marker = '/**\n * Set up event-driven modal handling';
          const end = source.indexOf(marker, start);
          if (start === -1 || end === -1) {
            throw new Error('Could not locate legacy URL credential injection block.');
          }

          const replacement = `function applyDevPreferencesFromURL() {
            try {
              const url = new URL(window.location.href);
              const providerOrder = url.searchParams.get('provider_order');
              const personaId = url.searchParams.get('persona');
              const enableLocal = url.searchParams.get('local_model');
              const ai = url.searchParams.get('ai');
              const legacySecretParams = ['gemini_key', 'claude_key', 'key'];

              let mutated = false;
              for (const param of legacySecretParams) {
                if (url.searchParams.has(param)) {
                  url.searchParams.delete(param);
                  mutated = true;
                }
              }

              if (providerOrder) {
                AIConfig.providerOrder = providerOrder.split(',').map(value => value.trim()).filter(Boolean);
                mutated = true;
              }
              if (personaId) {
                AIConfig.personaId = personaId;
                mutated = true;
              }
              if (enableLocal != null) {
                AIConfig.featureFlags = { useLocalModel: enableLocal === '1' || enableLocal === 'true' };
                mutated = true;
              }
              if (ai) mutated = true;

              for (const param of ['provider_order', 'persona', 'local_model', 'ai']) {
                url.searchParams.delete(param);
              }

              if (mutated) {
                window.history.replaceState({}, document.title, url.toString());
              }
            } catch (_) { /* ignore malformed development URLs */ }
          }

          `;

          source = `${source.slice(0, start)}${replacement}${source.slice(end)}`;
          fs.writeFileSync(path, source);
          NODE

      - name: Commit rewrite
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js
          git commit -m "security: remove URL credential injection"
          git push origin HEAD:chore/dependency-security-triage
