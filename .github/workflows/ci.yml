name: CI

on:
  pull_request:
    # Also prove stacked delivery branches before they are retargeted to main.
    branches: [ main, "codex/**" ]

  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    outputs:
      firebase_configured:
        value: ${{ jobs.build-test.outputs.firebase_configured }}

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      firebase_configured: ${{ steps.multiplayer_mode.outputs.firebase_configured }}
    env:
      VITE_FIREBASE_API_KEY: ${{ inputs.release && vars.VITE_FIREBASE_API_KEY || '' }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ inputs.release && vars.VITE_FIREBASE_AUTH_DOMAIN || '' }}
      VITE_FIREBASE_PROJECT_ID: ${{ inputs.release && vars.VITE_FIREBASE_PROJECT_ID || '' }}
      VITE_FIREBASE_APP_ID: ${{ inputs.release && vars.VITE_FIREBASE_APP_ID || '' }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ inputs.release && vars.VITE_FIREBASE_STORAGE_BUCKET || '' }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ inputs.release && vars.VITE_FIREBASE_MESSAGING_SENDER_ID || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install
        run: npm ci

      - name: Production dependency critical audit
        run: npm audit --omit=dev --audit-level=critical

      - name: Full dependency critical audit
        run: npm audit --audit-level=critical

      - name: Project doctrine contract
        run: npm run project:check

      - name: Release verifier regression tests
        run: node --test scripts/verify-pages.test.mjs

      - name: Source reachability inventory
        run: npm run source:reachability

      - name: Lint JS
        run: npm run lint

      - name: Lint CSS
        run: npm run lint:css

      - name: Test
        run: npm test -- --ci

      - name: Validate authored music content
        run: npm run needle-drop:validate

      - name: Record multiplayer mode
        id: multiplayer_mode
        run: node scripts/stamp-build.mjs --mode-only

      - name: Build
        run: npm run build

      - name: Stamp the build that will be tested and published
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_REF: ${{ github.ref }}
          BUILD_RUN_ID: ${{ github.run_id }}
        run: node scripts/stamp-build.mjs

      - name: Setup Java for Firestore emulator
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Firestore multiplayer security rules
        run: |
          npm install --no-save --package-lock=false @firebase/rules-unit-testing@5.0.2
          npx --yes firebase-tools@15.28.1 emulators:exec --only firestore --project demo-jeoparody-rules "node scripts/firestore-rules-check.mjs"

      - name: Install browser runtime test dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/jeoparody-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/jeoparody-preview.log
          exit 1

      - name: Verify built entrypoints and JavaScript assets
        env:
          PAGE_URL: http://127.0.0.1:4173/
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_MULTIPLAYER_TRANSPORT: ${{ steps.multiplayer_mode.outputs.firebase_configured == 'true' && 'firebase' || 'local' }}
        run: node scripts/verify-pages.mjs

      - name: Browser boot diagnostics
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node scripts/browser-boot-diagnostics.mjs

      - name: Blocking browser runtime check
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npm run runtime:check

      - name: Needle Drop browser runtime check
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npm run needle-drop:runtime-check

      - name: Head-to-head browser runtime check
        env:
          H2H_TRANSPORT: local
          BASE_URL: http://127.0.0.1:4173
        run: node scripts/head-to-head-runtime-check.mjs

      - name: A11y Audit (axe-core through Playwright)
        run: |
          node scripts/axe-audit.mjs http://127.0.0.1:4173/ axe-report.json
          node scripts/axe-audit.mjs http://127.0.0.1:4173/ axe-main-result-report.json main-result
          node scripts/axe-audit.mjs 'http://127.0.0.1:4173/needle-drop.html?players=4' axe-needle-drop-report.json
          node scripts/axe-audit.mjs 'http://127.0.0.1:4173/head-to-head.html?transport=local' axe-head-to-head-report.json

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-check-evidence
          path: |
            screenshots/runtime-check
            screenshots/needle-drop-runtime
            screenshots/head-to-head-runtime
            axe-report.json
            axe-main-result-report.json
            axe-needle-drop-report.json
            axe-head-to-head-report.json
            /tmp/jeoparody-preview.log
            firestore-debug.log
          if-no-files-found: ignore

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

      # This is the same dist directory exercised above. Never rebuild in deploy.
      - name: Upload verified Pages artifact
        if: inputs.release
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
