name: Run Security Docs Finalize

on:
  push:
    branches: [chore/dependency-security-triage]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/dependency-security-triage

      - name: Finalize canonical docs
        run: node scripts/finalize-security-docs.mjs

      - name: Commit handoff
        shell: bash
        run: |
          if git diff --quiet -- docs/MASTER_PLAN.md DEV_JOURNAL.md; then
            echo "Canonical docs already finalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/MASTER_PLAN.md DEV_JOURNAL.md
          git commit -m "docs: record security baseline and handoff"
          git push origin HEAD:chore/dependency-security-triage
