name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    with:
      release: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require Actions as the sole Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          if [ "$mode" != workflow ]; then
            echo "::error::Pages Source must be GitHub Actions (build_type=workflow); found '$mode'. Change Settings > Pages > Source and rerun."
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  verify-live:
    name: verify-live-pages
    runs-on: ubuntu-latest
    needs: [verify, deploy]
    env:
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
      EXPECTED_SHA: ${{ github.sha }}
      EXPECTED_MULTIPLAYER_TRANSPORT: ${{ needs.verify.outputs.firebase_configured == 'true' && 'firebase' || 'local' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify published commit, transport and bundled entrypoints
        run: node scripts/verify-pages.mjs
      - run: npm ci
      - name: Install browser runtime dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prove published Main and Needle Drop gameplay
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          npm run runtime:check
          npm run needle-drop:runtime-check
      - name: Recheck publication after browser proof
        run: node scripts/verify-pages.mjs
      - name: Upload published gameplay evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-pages-evidence
          path: |
            screenshots/runtime-check
            screenshots/needle-drop-runtime
          if-no-files-found: ignore

  verify-firebase-cloud:
    name: verify-firebase-cloud-multiplayer
    runs-on: ubuntu-latest
    needs: [verify, deploy, verify-live]
    if: needs.verify.outputs.firebase_configured == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install browser runtime dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prove live Firebase room + independent-user reconnect
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
          H2H_TRANSPORT: auto
          H2H_EVIDENCE_DIR: screenshots/head-to-head-cloud
        run: node scripts/head-to-head-runtime-check.mjs
      - name: Upload cloud multiplayer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: head-to-head-cloud-evidence
          path: screenshots/head-to-head-cloud
          if-no-files-found: ignore
