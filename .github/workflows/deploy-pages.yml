name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      firebase_configured: ${{ steps.multiplayer_mode.outputs.firebase_configured }}
    env:
      # Firebase's web configuration is client-visible configuration, not an
      # authorization secret. Store these as repository Actions variables.
      # When they are absent, Head-to-Head deliberately builds in local proving mode.
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run needle-drop:validate
      - run: npm test -- --runInBand

      - name: Report multiplayer deployment mode
        id: multiplayer_mode
        shell: bash
        run: |
          required=(
            VITE_FIREBASE_API_KEY
            VITE_FIREBASE_AUTH_DOMAIN
            VITE_FIREBASE_PROJECT_ID
            VITE_FIREBASE_APP_ID
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} == 0 )); then
            echo "firebase_configured=true" >> "$GITHUB_OUTPUT"
            echo "Firebase multiplayer configuration detected; Pages will build the cloud transport."
          else
            echo "firebase_configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Firebase multiplayer configuration is incomplete; Head-to-Head will build in local proving mode. Missing repository variables: ${missing[*]}"
          fi

      - run: npm run build

      - name: Stamp immutable build metadata
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_REF: ${{ github.ref }}
          BUILD_RUN_ID: ${{ github.run_id }}
          FIREBASE_CONFIGURED: ${{ steps.multiplayer_mode.outputs.firebase_configured }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const metadata = {
            gitSha: process.env.BUILD_SHA,
            gitRef: process.env.BUILD_REF,
            workflowRunId: process.env.BUILD_RUN_ID,
            multiplayerTransport: process.env.FIREBASE_CONFIGURED === 'true' ? 'firebase' : 'local',
            builtAt: new Date().toISOString(),
          };

          fs.writeFileSync(
            'dist/build-meta.json',
            `${JSON.stringify(metadata, null, 2)}\n`,
          );
          NODE

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  verify-live:
    name: verify-live-pages
    runs-on: ubuntu-latest
    needs: [build, deploy]
    env:
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
      EXPECTED_SHA: ${{ github.sha }}
      EXPECTED_MULTIPLAYER_TRANSPORT: ${{ needs.build.outputs.firebase_configured == 'true' && 'firebase' || 'local' }}
    steps:
      - name: Verify published entrypoints and exact commit
        shell: bash
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"

          fetch() {
            local path="$1"
            local output="$2"
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 12 \
              --retry-delay 5 \
              --retry-all-errors \
              --max-time 30 \
              "$base/$path?verify=$EXPECTED_SHA" \
              --output "$output"
          }

          fetch "" /tmp/jeoparody-root.html
          fetch "needle-drop.html" /tmp/jeoparody-needle-drop.html
          fetch "head-to-head.html" /tmp/jeoparody-head-to-head.html
          fetch "build-meta.json" /tmp/jeoparody-build-meta.json

          grep -q '<html' /tmp/jeoparody-root.html
          grep -q 'head-to-head-app' /tmp/jeoparody-head-to-head.html

          EXPECTED_SHA="$EXPECTED_SHA" EXPECTED_MULTIPLAYER_TRANSPORT="$EXPECTED_MULTIPLAYER_TRANSPORT" node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const metadata = JSON.parse(
            fs.readFileSync('/tmp/jeoparody-build-meta.json', 'utf8'),
          );

          if (metadata.gitSha !== process.env.EXPECTED_SHA) {
            console.error(
              `Pages commit mismatch: expected ${process.env.EXPECTED_SHA}, received ${metadata.gitSha}`,
            );
            process.exit(1);
          }

          if (metadata.multiplayerTransport !== process.env.EXPECTED_MULTIPLAYER_TRANSPORT) {
            console.error(
              `Pages multiplayer mode mismatch: expected ${process.env.EXPECTED_MULTIPLAYER_TRANSPORT}, received ${metadata.multiplayerTransport}`,
            );
            process.exit(1);
          }

          console.log(
            `Verified live Pages commit ${metadata.gitSha} with ${metadata.multiplayerTransport} multiplayer transport.`,
          );
          NODE

  verify-firebase-cloud:
    name: verify-firebase-cloud-multiplayer
    runs-on: ubuntu-latest
    needs: [build, deploy, verify-live]
    if: needs.build.outputs.firebase_configured == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install browser runtime dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prove live Firebase room + independent-user reconnect
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
          H2H_TRANSPORT: auto
          H2H_EVIDENCE_DIR: screenshots/head-to-head-cloud
        run: node scripts/head-to-head-runtime-check.mjs
      - name: Upload cloud multiplayer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: head-to-head-cloud-evidence
          path: screenshots/head-to-head-cloud
          if-no-files-found: ignore
