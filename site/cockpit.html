<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shipyard Cockpit | JeoPARODY</title>
    <style>
        :root {
            --bg: #0f1117;
            --panel: #1a1d27;
            --text: #e2e8f0;
            --text-dim: #94a3b8;
            --accent: #38bdf8;
            --red: #ef4444;
            --green: #22c55e;
            --yellow: #eab308;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 2rem;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid #334155;
            padding-bottom: 1rem;
        }
        h1 { margin: 0; font-size: 1.5rem; letter-spacing: -0.025em; }
        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .status-green { background: rgba(34, 197, 94, 0.2); color: var(--green); }
        .status-red { background: rgba(239, 68, 68, 0.2); color: var(--red); }
        
        .grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }
        .panel {
            background: var(--panel);
            border-radius: 0.75rem;
            padding: 1.5rem;
            border: 1px solid #334155;
        }
        h2 { font-size: 1rem; color: var(--text-dim); margin-top: 0; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.05em; }
        
        .claim-row {
            padding: 1rem 0;
            border-bottom: 1px solid #334155;
        }
        .claim-row:last-child { border-bottom: none; }
        .claim-header { display: flex; justify-content: space-between; margin-bottom: 0.5rem; }
        .owner { font-weight: 600; color: var(--accent); }
        .area { font-weight: 700; }
        .files { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 0.85rem; color: var(--text-dim); }

        .drift-item {
            background: rgba(239, 68, 68, 0.1);
            border-left: 4px solid var(--red);
            padding: 1rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
        .drift-type { font-weight: 800; font-size: 0.7rem; display: block; margin-bottom: 0.25rem; }

        .log-item {
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }
        .log-time { color: var(--text-dim); font-size: 0.75rem; }
        .log-task { font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚢 SHIPYARD COCKPIT</h1>
            <div id="repo-status"></div>
        </header>

        <div class="grid">
            <div class="main-deck">
                <section class="panel">
                    <h2>Active Claims & Ownership</h2>
                    <div id="claims-list"></div>
                </section>
            </div>
            
            <div class="side-deck">
                <section class="panel" style="margin-bottom: 2rem;">
                    <h2>Coordination Drift</h2>
                    <div id="drift-list"></div>
                </section>

                <section class="panel">
                    <h2>Recent Agent Activity</h2>
                    <div id="activity-list"></div>
                </section>
            </div>
        </div>
    </div>

    <script>
        async function loadTruth() {
            try {
                const response = await fetch('data/project-truth.json');
                const truth = await response.json();
                render(truth);
            } catch (e) {
                document.body.innerHTML = `<div class="container"><h1>Cockpit Error</h1><p>Could not load project-truth.json. Run <code>npm run build:cockpit</code> first.</p></div>`;
            }
        }

        function render(truth) {
            const statusEl = document.getElementById('repo-status');
            const hasDrift = truth.drift.length > 0;
            statusEl.innerHTML = `<span class="status-badge ${hasDrift ? 'status-red' : 'status-green'}">${hasDrift ? 'Drift Detected' : 'Stable'}</span>`;

            const claimsEl = document.getElementById('claims-list');
            claimsEl.innerHTML = truth.activeWork.map(c => `
                <div class="claim-row">
                    <div class="claim-header">
                        <span class="area">${c.area}</span>
                        <span class="status-badge ${c.status === 'Done' ? 'status-green' : 'status-yellow'}">${c.status}</span>
                    </div>
                    <div style="margin-bottom: 0.5rem;"><span class="owner">${c.owner}</span> • ${c.started}</div>
                    <div class="files">${c.claimed}</div>
                    <div style="font-size: 0.85rem; margin-top: 0.5rem;">${c.notes}</div>
                </div>
            `).join('');

            const driftEl = document.getElementById('drift-list');
            if (truth.drift.length === 0) {
                driftEl.innerHTML = '<p style="color: var(--green); font-size: 0.9rem;">✓ No coordination drift detected.</p>';
            } else {
                driftEl.innerHTML = truth.drift.map(d => `
                    <div class="drift-item">
                        <span class="drift-type">${d.type} [${d.severity}]</span>
                        ${d.message}
                    </div>
                `).join('');
            }

            const activityEl = document.getElementById('activity-list');
            activityEl.innerHTML = truth.recentLogs.map(l => `
                <div class="log-item">
                    <div class="log-time">${l.timestamp}</div>
                    <div class="log-task">${l.agent}: ${l.task}</div>
                </div>
            `).join('');
        }

        loadTruth();
    </script>
</body>
</html>
